<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photocopier</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --bg: #f4f4f1; --fg: #1d1d1b; --muted: #6b6b66; --accent: #2457d6; --ok: #1f8a4c; --err: #c0392b; --card: #fff; --line: #deded8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --accent: #6b93ff; --ok: #46c27b; --err: #ff6b5b; --card: #222220; --line: #34342f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
  body.dragging main { outline: 3px dashed var(--accent); outline-offset: -8px; }
  [hidden] { display: none !important; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; min-height: 100dvh; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  p { margin: 0 0 6px; color: var(--muted); }
  code { color: var(--fg); background: var(--card); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; word-break: break-all; }
  button, .btn { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--accent); color: #fff;
                 font-weight: 600; text-decoration: none; display: inline-block; }
  button.ghost, .btn.ghost { background: transparent; color: var(--muted); padding: 8px; }
  button.done { background: var(--ok); }
  .ok { color: var(--ok); } .err { color: var(--err); }
  input[type=file] { display: none; }

  #host-head { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  #host-head > div:last-child { flex: 1 1 320px; min-width: 0; }
  #qr { background: #fff; padding: 10px; border-radius: 12px; line-height: 0; }
  #qr:empty { display: none; }
  #client-head { text-align: center; }
  #status { font-weight: 500; margin-top: 16px; }

  .actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 24px; }
  body.client.touch .actions { flex-direction: column; }
  label.shoot { display: flex; align-items: center; justify-content: center; width: 180px; height: 180px; border-radius: 50%;
                background: var(--accent); color: #fff; font-size: 20px; font-weight: 600; cursor: pointer;
                box-shadow: 0 8px 24px rgb(0 0 0 / .2); user-select: none; -webkit-tap-highlight-color: transparent; }
  label.shoot:active { transform: scale(.96); }
  .opt { font-size: 14px; color: var(--muted); display: block; }
  #sendstatus { min-height: 1.4em; margin-top: 12px; font-weight: 500; }
  body.client.touch #sendstatus, body.client.touch .actions + .opt { text-align: center; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .card.new { outline: 3px solid var(--accent); }
  .card .thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #0000000d; }
  .card img.thumb { cursor: pointer; }
  .card .file { flex: 1; aspect-ratio: auto; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; }
  .card .file b { font-size: 48px; line-height: 1; }
  .card .file span { word-break: break-all; }
  .bar { margin-top: auto; display: flex; gap: 4px; padding: 10px; align-items: center; }
  .bar .meta { flex: 1; color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #empty { color: var(--muted); padding: 40px 16px; text-align: center; border: 2px dashed var(--line); border-radius: 14px; }
  .textbox { display: flex; gap: 8px; margin-top: 16px; align-items: stretch; max-width: 640px; }
  body.client.touch .textbox { margin-left: auto; margin-right: auto; }
  .textbox textarea { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
                      background: var(--card); color: var(--fg); resize: vertical; min-height: 44px; }
  .transfer { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .transfer progress { display: block; width: 100%; max-width: 640px; height: 8px; margin-top: 4px; accent-color: var(--accent); }
  body.client.touch .transfer progress { margin: 4px auto 0; }
  .card .text { flex: 1; margin: 0; padding: 14px; min-height: 100px; max-height: 260px; overflow: auto; white-space: pre-wrap;
                word-break: break-word; font: 15px/1.45 system-ui, sans-serif; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); max-width: calc(100% - 32px);
           padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header id="host-head" hidden>
    <div id="qr"></div>
    <div>
      <h1>📷 Photocopier</h1>
      <p>QR-Code mit dem Handy oder einem anderen Rechner öffnen – dann Fotos, Dateien und Texte in beide Richtungen schicken.</p>
      <p>Link: <code id="link">…</code>
        <button id="newlink" class="ghost" title="Alter Link funktioniert danach nicht mehr">↻ Neuen Link erzeugen</button></p>
    </div>
  </header>
  <header id="client-head" hidden>
    <h1>📷 Photocopier</h1>
  </header>
  <p id="status">Verbinde …</p>

  <section class="actions">
    <label class="shoot touch-only" for="camera">Foto machen</label>
    <input id="camera" type="file" accept="image/*" capture="environment">
    <label class="btn" for="files">📎 Dateien senden</label>
    <input id="files" type="file" multiple>
    <span class="opt mouse-only">oder Dateien ins Fenster ziehen</span>
  </section>
  <label class="opt touch-only" style="margin-top: 12px"><input id="full" type="checkbox"> Fotos in Originalgröße senden</label>
  <form class="textbox" id="textform">
    <textarea id="text" rows="2" placeholder="Text oder Link senden …"></textarea>
    <button type="submit">Senden</button>
  </form>
  <div id="sendstatus"></div>
  <div class="transfer" id="sendprogress" hidden><progress max="1" value="0"></progress></div>

  <h2>Empfangen</h2>
  <label class="opt" style="margin-bottom: 12px"><input id="auto" type="checkbox" checked> Neue Bilder und Texte automatisch in die Zwischenablage kopieren (wenn dieses Fenster aktiv ist)</label>
  <div id="incoming"></div>
  <div id="empty">Noch nichts empfangen.</div>
  <div id="grid"></div>
</main>
<div id="toast"></div>

<script>
// Geräte verbinden sich direkt per WebRTC (PeerJS). Der kostenlose PeerJS-Server vermittelt nur den
// Verbindungsaufbau – Fotos und Dateien gehen verschlüsselt direkt von Gerät zu Gerät (nur wenn das
// nicht klappt, über den TURN-Weiterleitungsserver von PeerJS, der die Daten nicht lesen kann).
// Das Gerät ohne #kennung in der Adresse ist der "Host" (zeigt den QR-Code); alle, die den Link öffnen,
// verbinden sich mit ihm. Host und verbundene Geräte können sich gegenseitig Dateien schicken.
const PEER_OPTIONS = window.PEER_OPTIONS || {}; // nur zum lokalen Testen überschreibbar
const MAX_EDGE = 2560;
const $ = (id) => document.getElementById(id);
const hostId = location.hash.slice(1);
const isHost = !hostId;
const isTouch = matchMedia('(pointer: coarse)').matches;
// Dateien werden in Stücken geschickt; der Empfänger meldet zurück, wie viel angekommen ist.
// Daraus entsteht der Fortschrittsbalken, und es muss nie die ganze Datei auf einmal in den Speicher.
const CHUNK = 256 * 1024;
const WINDOW = 4 * 1024 * 1024; // so viel darf unterwegs sein, bevor auf Rückmeldung gewartet wird
const STALL_MS = 30000; // so lange ohne Rückmeldung gilt die Übertragung als abgebrochen
const items = new Map(); // empfangene Dateien/Texte: id -> { blob, name } bzw. { text }
const incoming = new Map(); // laufende Empfänge: id -> { conn, name, type, size, chunks, received, el }
const outgoing = new Map(); // laufende Sendungen: id -> transfer()
let toastTimer;

document.body.classList.add(isHost ? 'host' : 'client', isTouch ? 'touch' : 'mouse');
document.querySelectorAll(isTouch ? '.mouse-only' : '.touch-only').forEach((el) => { el.hidden = true; });

function setStatus(el, text, cls = '') { el.textContent = text; el.className = cls; }

function storage(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch { return null; }
}

function showToast(text) {
  const toast = $('toast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

function formatSize(bytes) {
  if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB';
}

// ---------- Empfangen ----------

// Die Zwischenablage nimmt zuverlässig nur PNG – deshalb wird jedes Bild zu PNG umgewandelt.
async function toPng(blob) {
  if (blob.type === 'image/png') return blob;
  const bitmap = await createImageBitmap(blob);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0);
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('PNG fehlgeschlagen'))), 'image/png'));
}

async function copy(id, button, silent = false) {
  const item = items.get(id);
  try {
    if (item.text !== undefined) {
      if (!navigator.clipboard?.writeText) throw new Error('Browser unterstützt keine Zwischenablage');
      await navigator.clipboard.writeText(item.text);
    } else {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('Browser unterstützt keine Bild-Zwischenablage');
      // Promise direkt übergeben, damit die Nutzer-Geste (Klick) erhalten bleibt – wichtig für Safari.
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': toPng(item.blob) })]);
    }
    button.textContent = '✓ Kopiert';
    button.classList.add('done');
    setTimeout(() => { button.textContent = 'Kopieren'; button.classList.remove('done'); }, 2000);
    showToast('In die Zwischenablage kopiert – jetzt mit Strg/⌘ + V einfügen');
  } catch (e) {
    const what = item.text !== undefined ? 'Text' : 'Bild';
    showToast(silent ? `Neuer ${what} da – zum Kopieren klicken` : 'Kopieren fehlgeschlagen: ' + e.message);
  }
}

function removeOnDelete(card, id, url) {
  card.querySelector('[data-act=del]').onclick = () => {
    items.delete(id);
    if (url) URL.revokeObjectURL(url);
    card.remove();
    if (!items.size) $('empty').hidden = false;
  };
}

function prependCard(card) {
  $('empty').hidden = true;
  $('grid').querySelectorAll('.card.new').forEach((c) => c.classList.remove('new'));
  $('grid').prepend(card);
}

const timeNow = () => new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

function addText(text) {
  const id = crypto.randomUUID();
  items.set(id, { text });
  const card = document.createElement('div');
  card.className = 'card new';
  card.innerHTML = `
    <pre class="text"></pre>
    <div class="bar">
      <span class="meta"></span>
      <button class="ghost" data-act="del" title="Entfernen">🗑</button>
      <a class="btn ghost" data-act="open" title="Link öffnen" target="_blank" rel="noopener noreferrer" hidden>↗</a>
      <button data-act="copy">Kopieren</button>
    </div>`;
  // Text kommt vom anderen Gerät – nur als Text einsetzen, nie als HTML.
  card.querySelector('.text').textContent = text;
  card.querySelector('.meta').textContent = `${timeNow()} · Text · ${text.length} Zeichen`;
  // Besteht der Text nur aus einem Link, gibt es einen Knopf zum Öffnen (nur http/https).
  if (/^https?:\/\/\S+$/i.test(text.trim())) {
    const open = card.querySelector('[data-act=open]');
    open.href = text.trim();
    open.hidden = false;
  }
  removeOnDelete(card, id);
  prependCard(card);

  const copyBtn = card.querySelector('[data-act=copy]');
  copyBtn.onclick = () => copy(id, copyBtn);
  if ($('auto').checked && document.hasFocus()) copy(id, copyBtn, true);
  else showToast('Neuer Text empfangen');
}

function canShare(file) {
  try { return !!navigator.canShare?.({ files: [file] }); } catch { return false; }
}

function addItem(blob, name) {
  const id = crypto.randomUUID();
  items.set(id, { blob, name });
  const isImage = blob.type.startsWith('image/');
  const url = URL.createObjectURL(blob);

  const card = document.createElement('div');
  card.className = 'card new';
  card.innerHTML = `
    ${isImage ? '<img class="thumb" alt="" title="Klicken zum Kopieren">' : '<div class="thumb file"><b>📄</b><span></span></div>'}
    <div class="bar">
      <span class="meta"></span>
      <button class="ghost" data-act="del" title="Entfernen">🗑</button>
      <button class="ghost" data-act="share" title="Teilen / in Fotos sichern" hidden>📤</button>
      <a class="btn ghost" data-act="download" title="Herunterladen">⬇</a>
      ${isImage ? '<button data-act="copy">Kopieren</button>' : ''}
    </div>`;
  // Name kommt vom anderen Gerät – nur als Text einsetzen, nie als HTML.
  const meta = card.querySelector('.meta');
  meta.textContent = `${timeNow()} · ${formatSize(blob.size)} · ${name}`;
  meta.title = name;
  if (isImage) card.querySelector('img').src = url;
  else card.querySelector('.file span').textContent = name;

  const download = card.querySelector('[data-act=download]');
  download.href = url;
  download.download = name;

  const file = new File([blob], name, { type: blob.type });
  const shareBtn = card.querySelector('[data-act=share]');
  if (isTouch && canShare(file)) {
    shareBtn.hidden = false;
    shareBtn.onclick = () => navigator.share({ files: [file] }).catch(() => {});
  }

  removeOnDelete(card, id, url);
  prependCard(card);

  if (isImage) {
    const copyBtn = card.querySelector('[data-act=copy]');
    copyBtn.onclick = () => copy(id, copyBtn);
    card.querySelector('img').onclick = () => copy(id, copyBtn);
    if ($('auto').checked && document.hasFocus()) copy(id, copyBtn, true);
    else showToast('Neues Bild empfangen');
  } else {
    showToast('Datei empfangen: ' + name);
  }
}

// Ablauf einer Datei: start → chunk, chunk, … → end. Der Empfänger antwortet mit progress und am Ende mit ack.
function onData(conn, msg) {
  switch (msg?.kind) {
    case 'start': {
      const name = String(msg.name || 'datei');
      const size = Number(msg.size) || 0;
      const el = document.createElement('div');
      el.className = 'transfer';
      el.innerHTML = '<span></span><progress max="1" value="0"></progress>';
      el.querySelector('span').textContent = `Empfange ${name} – ${formatSize(size)} …`;
      $('incoming').append(el);
      incoming.set(msg.id, { conn, name, type: msg.type || 'application/octet-stream', size, chunks: [], received: 0, el });
      watchIncoming(msg.id);
      break;
    }
    case 'chunk': {
      const t = incoming.get(msg.id);
      if (!t) return;
      t.chunks.push(msg.data);
      t.received += msg.data.byteLength;
      t.el.querySelector('progress').value = t.size ? t.received / t.size : 1;
      conn.send({ kind: 'progress', id: msg.id, received: t.received });
      watchIncoming(msg.id);
      break;
    }
    case 'end': {
      const t = incoming.get(msg.id);
      if (!t) return;
      incoming.delete(msg.id);
      clearTimeout(t.timer);
      t.el.remove();
      addItem(new Blob(t.chunks, { type: t.type }), t.name);
      conn.send({ kind: 'ack', id: msg.id });
      break;
    }
    case 'text':
      addText(String(msg.text));
      conn.send({ kind: 'ack', id: msg.id });
      break;
    case 'progress':
      outgoing.get(msg.id)?.onProgress(conn, msg.received);
      break;
    case 'ack':
      outgoing.get(msg.id)?.onAck(conn);
      break;
  }
}

// Halb empfangene Dateien verwerfen – wenn die Verbindung abbricht oder zu lange nichts mehr kommt
// (WebRTC meldet das Ende einer Verbindung manchmal erst sehr spät).
function abortIncoming(id) {
  const t = incoming.get(id);
  if (!t) return;
  clearTimeout(t.timer);
  t.el.remove();
  incoming.delete(id);
  showToast(`Empfang von ${t.name} abgebrochen`);
}

function watchIncoming(id) {
  const t = incoming.get(id);
  clearTimeout(t.timer);
  t.timer = setTimeout(() => abortIncoming(id), STALL_MS);
}

function dropIncoming(conn) {
  for (const [id, t] of incoming) if (t.conn === conn) abortIncoming(id);
}

// ---------- Senden ----------

async function shrink(file) {
  if ($('full').checked) return file;
  const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  if (!bitmap) return file;
  const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.9));
  return blob ? new File([blob], `foto-${Date.now()}.jpg`, { type: 'image/jpeg' }) : file;
}

let getTargets; // liefert die offenen Verbindungen, an die gesendet wird (Host: alle Geräte, sonst: der Host)

// Verfolgt die Rückmeldungen aller Empfänger einer Sendung.
function transfer(targets, onUpdate = () => {}) {
  const received = new Map(targets.map((c) => [c, 0]));
  const acked = new Set();
  let waiters = [];
  const wake = () => { const w = waiters; waiters = []; w.forEach((fn) => fn()); };
  return {
    minReceived: () => Math.min(...received.values()),
    allAcked: () => acked.size === targets.length,
    onProgress(conn, n) { received.set(conn, n); onUpdate(); wake(); },
    onAck(conn) { acked.add(conn); wake(); },
    // wartet, bis cond() stimmt – oder bricht ab, wenn zu lange keine Rückmeldung kommt
    waitUntil(cond) {
      return new Promise((resolve, reject) => {
        if (cond()) return resolve();
        const timer = setTimeout(() => reject(new Error('Keine Rückmeldung vom anderen Gerät – Verbindung abgebrochen?')), STALL_MS);
        const check = () => {
          if (cond()) { clearTimeout(timer); resolve(); } else waiters.push(check);
        };
        waiters.push(check);
      });
    },
  };
}

async function sendFile(file, targets, onUpdate) {
  const id = crypto.randomUUID();
  const t = transfer(targets, () => onUpdate(t.minReceived()));
  outgoing.set(id, t);
  try {
    for (const c of targets) c.send({ kind: 'start', id, name: file.name || 'datei', type: file.type, size: file.size });
    for (let offset = 0; offset < file.size; offset += CHUNK) {
      await t.waitUntil(() => offset - t.minReceived() < WINDOW);
      const data = await file.slice(offset, offset + CHUNK).arrayBuffer();
      for (const c of targets) c.send({ kind: 'chunk', id, data });
    }
    for (const c of targets) c.send({ kind: 'end', id });
    await t.waitUntil(t.allAcked);
  } finally {
    outgoing.delete(id);
  }
}

function showProgress(value) {
  const box = $('sendprogress');
  box.hidden = value === null;
  if (value !== null) box.querySelector('progress').value = value;
}

async function sendFiles(files, { isPhoto = false } = {}) {
  const status = $('sendstatus');
  if (!files.length) return;
  try {
    const targets = await getTargets();
    if (!targets.length) throw new Error('Noch kein Gerät verbunden');
    for (const [i, original] of files.entries()) {
      const file = isPhoto ? await shrink(original) : original;
      const label = files.length > 1 ? ` (${i + 1}/${files.length})` : '';
      const total = formatSize(file.size);
      setStatus(status, `Sende ${file.name}${label} – ${total} …`);
      showProgress(0);
      await sendFile(file, targets, (done) => {
        setStatus(status, `Sende ${file.name}${label} – ${formatSize(done)} von ${total}`);
        showProgress(file.size ? done / file.size : 1);
      });
    }
    const where = isHost && targets.length > 1 ? `an ${targets.length} Geräte` : 'angekommen';
    setStatus(status, `✓ ${files.length > 1 ? files.length + ' Dateien' : files[0].name} ${where}`, 'ok');
    navigator.vibrate?.(60);
  } catch (e) {
    setStatus(status, 'Fehler: ' + e.message, 'err');
  }
  showProgress(null);
}

async function sendText(text) {
  const status = $('sendstatus');
  try {
    const targets = await getTargets();
    if (!targets.length) throw new Error('Noch kein Gerät verbunden');
    const id = crypto.randomUUID();
    const t = transfer(targets);
    outgoing.set(id, t);
    try {
      for (const c of targets) c.send({ kind: 'text', id, text });
      await t.waitUntil(t.allAcked);
    } finally {
      outgoing.delete(id);
    }
    setStatus(status, `✓ Text ${isHost && targets.length > 1 ? `an ${targets.length} Geräte gesendet` : 'angekommen'}`, 'ok');
    navigator.vibrate?.(60);
    return true;
  } catch (e) {
    setStatus(status, 'Fehler: ' + e.message, 'err');
    return false;
  }
}

$('textform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('text').value;
  if (!text.trim()) return;
  if (await sendText(text)) $('text').value = '';
});
// Strg/⌘ + Enter sendet, Enter allein macht eine neue Zeile
$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('textform').requestSubmit();
});

$('camera').addEventListener('change', (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  sendFiles(files, { isPhoto: true });
});
$('files').addEventListener('change', (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  sendFiles(files);
});

// Dateien ins Fenster ziehen
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  dragDepth = 0;
  document.body.classList.remove('dragging');
  if (!e.dataTransfer.files.length) return; // gezogener Text landet normal im Textfeld
  e.preventDefault();
  sendFiles([...e.dataTransfer.files]);
});

if (isHost) host(); else client();

// ---------- Host (zeigt QR-Code) ----------
function host() {
  $('host-head').hidden = false;
  const status = $('status');
  const conns = new Set();

  // Feste ID pro Browser, damit ein Lesezeichen auf dem Handy dauerhaft funktioniert.
  const newId = () => 'photocopier-' + crypto.randomUUID().replace(/-/g, '').slice(0, 16);
  let id = storage('photocopier-id');
  if (!id) {
    id = newId();
    storage('photocopier-id', id);
  }

  // Neue Kennung = neuer Link; wer den alten Link hat, kann danach nichts mehr schicken.
  $('newlink').onclick = () => {
    const warning = 'Neuen Link erzeugen?\n\nDer alte Link und gespeicherte Lesezeichen funktionieren danach nicht mehr.'
      + (items.size ? '\nDie empfangenen Dateien werden dabei entfernt.' : '');
    if (!confirm(warning)) return;
    storage('photocopier-id', newId());
    peer.destroy();
    location.reload();
  };

  const link = location.origin + location.pathname + '#' + id;
  $('link').textContent = link;
  if (window.qrcode) {
    const qr = qrcode(0, 'M');
    qr.addData(link);
    qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 5, margin: 0 });
  }

  function updateStatus() {
    const n = conns.size;
    if (!n) setStatus(status, '● Bereit – warte auf ein Gerät', 'ok');
    else setStatus(status, `● ${n === 1 ? '1 Gerät' : n + ' Geräte'} verbunden`, 'ok');
  }

  getTargets = async () => [...conns].filter((c) => c.open);

  const peer = new Peer(id, PEER_OPTIONS);
  peer.on('open', updateStatus);
  peer.on('disconnected', () => {
    setStatus(status, 'Verbindung zum Vermittlungsserver verloren – verbinde neu …');
    setTimeout(() => peer.reconnect(), 2000);
  });
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') setStatus(status, 'Photocopier ist schon in einem anderen Tab geöffnet. Bitte diesen Tab schließen.', 'err');
    else setStatus(status, 'Fehler: ' + e.message, 'err');
  });
  peer.on('connection', (conn) => {
    conn.on('open', () => { conns.add(conn); updateStatus(); });
    conn.on('data', (msg) => onData(conn, msg));
    conn.on('close', () => { conns.delete(conn); dropIncoming(conn); updateStatus(); });
  });
}

// ---------- Verbundenes Gerät (Link mit #kennung geöffnet) ----------
function client() {
  $('client-head').hidden = false;
  const status = $('status');
  if (isTouch) status.style.textAlign = 'center';
  const peer = new Peer(PEER_OPTIONS);
  let conn = null;

  function connect() {
    return new Promise((resolve, reject) => {
      if (conn?.open) return resolve(conn);
      const c = peer.connect(hostId, { reliable: true });
      const timer = setTimeout(() => reject(new Error('Anderes Gerät nicht erreichbar – ist die Seite dort offen?')), 15000);
      c.on('open', () => {
        clearTimeout(timer);
        conn = c;
        setStatus(status, '● Verbunden', 'ok');
        resolve(c);
      });
      c.on('data', (msg) => onData(c, msg));
      c.on('close', () => {
        conn = null;
        dropIncoming(c);
        setStatus(status, 'Verbindung getrennt – verbinde neu …');
        // automatisch neu verbinden, damit auch ohne eigenes Senden weiter empfangen wird
        setTimeout(() => connect().catch((e) => setStatus(status, e.message, 'err')), 3000);
      });
      c.on('error', (e) => { clearTimeout(timer); reject(e); });
    });
  }

  getTargets = async () => [await connect()];

  peer.on('open', () => connect().catch((e) => setStatus(status, e.message, 'err')));
  peer.on('disconnected', () => setTimeout(() => peer.reconnect(), 2000));
  peer.on('error', (e) => {
    if (e.type === 'peer-unavailable') setStatus(status, 'Anderes Gerät nicht gefunden – ist die Seite dort geöffnet?', 'err');
    else setStatus(status, 'Fehler: ' + e.message, 'err');
  });
}
