<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photocopier – Handy</title>
<style>
  :root { --bg: #f4f4f1; --fg: #1d1d1b; --muted: #6b6b66; --accent: #2457d6; --ok: #1f8a4c; --err: #c0392b; --card: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --accent: #6b93ff; --ok: #46c27b; --err: #ff6b5b; --card: #222220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 20px; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; text-align: center; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); }
  label.shoot { display: flex; align-items: center; justify-content: center; width: 200px; height: 200px; border-radius: 50%;
                background: var(--accent); color: #fff; font-size: 20px; font-weight: 600; cursor: pointer;
                box-shadow: 0 8px 24px rgb(0 0 0 / .2); user-select: none; -webkit-tap-highlight-color: transparent; }
  label.shoot:active { transform: scale(.96); }
  input[type=file] { display: none; }
  #preview { max-width: 100%; max-height: 35dvh; border-radius: 12px; display: none; }
  #status { min-height: 1.4em; font-weight: 500; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  .small { font-size: 14px; }
  .small label { color: var(--muted); }
</style>
</head>
<body>
  <h1>📷 Photocopier</h1>
  <label class="shoot" for="camera">Foto machen</label>
  <input id="camera" type="file" accept="image/*" capture="environment">
  <img id="preview" alt="Vorschau">
  <div id="status"></div>
  <div class="small"><label><input id="full" type="checkbox"> Originalgröße senden</label></div>
  <p class="small"><label for="pick" style="text-decoration: underline; cursor: pointer;">oder Bild aus Galerie wählen</label></p>
  <input id="pick" type="file" accept="image/*">

<script>
const MAX_EDGE = 2560; // verkleinert große Handyfotos, damit die Zwischenablage nicht riesig wird
const status = document.getElementById('status');
const preview = document.getElementById('preview');

function setStatus(text, cls = '') { status.textContent = text; status.className = cls; }

async function shrink(file) {
  if (document.getElementById('full').checked) return file;
  const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  if (!bitmap) return file;
  const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob((b) => resolve(b || file), 'image/jpeg', 0.9));
}

async function handle(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  setStatus('Sende …');
  try {
    const blob = await shrink(file);
    const res = await fetch('/upload', { method: 'POST', headers: { 'Content-Type': blob.type || 'image/jpeg' }, body: blob });
    if (!res.ok) throw new Error(await res.text());
    setStatus('✓ Am Desktop angekommen', 'ok');
    navigator.vibrate?.(60);
  } catch (e) {
    setStatus('Fehler: ' + e.message, 'err');
  }
}

document.getElementById('camera').addEventListener('change', (e) => handle(e.target));
document.getElementById('pick').addEventListener('change', (e) => handle(e.target));
</script>
</body>
</html>
